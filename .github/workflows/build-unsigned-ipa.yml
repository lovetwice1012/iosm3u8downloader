name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and package unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show Xcode environment
        run: |
          test "$(uname -m)" = "arm64"
          uname -a
          xcodebuild -version
          xcodebuild -showsdks

      - name: Choose an available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID=$(/usr/bin/python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          for runtime_devices in data.get("devices", {}).values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone Simulator was found")
          PY
          )
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests without signing
        run: |
          xcodebuild test \
            -project HLSDownloader.xcodeproj \
            -scheme HLSDownloader \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned arm64 iPhone app
        run: |
          xcodebuild build \
            -project HLSDownloader.xcodeproj \
            -scheme HLSDownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            VALIDATE_PRODUCT=NO \
            DEVELOPMENT_TEAM=""

      - name: Package re-signable unsigned IPA
        shell: bash
        run: |
          APP_PATH="build/device/Build/Products/Release-iphoneos/HLSDownloader.app"
          test -f "$APP_PATH/HLSDownloader"
          test -f "$APP_PATH/Frameworks/ffmpegkit.framework/ffmpegkit"
          test -f "$APP_PATH/ThirdPartyNotices.txt"

          rm -rf Payload artifacts
          mkdir -p Payload artifacts
          cp -R "$APP_PATH" Payload/HLSDownloader.app

          while IFS= read -r -d '' FRAMEWORK; do
            codesign --remove-signature "$FRAMEWORK" 2>/dev/null || true
            rm -rf "$FRAMEWORK/_CodeSignature"
          done < <(find Payload/HLSDownloader.app/Frameworks -type d -name '*.framework' -print0)
          codesign --remove-signature Payload/HLSDownloader.app 2>/dev/null || true
          rm -rf Payload/HLSDownloader.app/_CodeSignature
          rm -f Payload/HLSDownloader.app/embedded.mobileprovision

          if codesign --verify Payload/HLSDownloader.app 2>/dev/null; then
            echo "Expected an unsigned app, but codesign verification succeeded."
            exit 1
          fi
          while IFS= read -r -d '' FRAMEWORK; do
            if codesign --verify "$FRAMEWORK" 2>/dev/null; then
              echo "Expected an unsigned framework, but codesign verification succeeded: $FRAMEWORK"
              exit 1
            fi
          done < <(find Payload/HLSDownloader.app/Frameworks -type d -name '*.framework' -print0)
          if find Payload/HLSDownloader.app -type d -name _CodeSignature | grep -q .; then
            echo "A code signature directory remains in the packaged app."
            exit 1
          fi
          lipo -info Payload/HLSDownloader.app/HLSDownloader | grep -q "arm64"
          lipo -info Payload/HLSDownloader.app/Frameworks/ffmpegkit.framework/ffmpegkit | grep -q "arm64"
          if ! otool -L Payload/HLSDownloader.app/HLSDownloader \
            | grep -Fq '@rpath/ffmpegkit.framework/ffmpegkit'; then
            echo "The app does not link the bundled ffmpegkit framework through @rpath."
            exit 1
          fi
          if ! otool -l Payload/HLSDownloader.app/HLSDownloader | awk '
            $1 == "cmd" && $2 == "LC_RPATH" { inspecting = 1; next }
            inspecting && $1 == "path" {
              if ($2 == "@executable_path/Frameworks") found = 1
              inspecting = 0
            }
            END { exit(found ? 0 : 1) }
          '; then
            echo "The app is missing LC_RPATH @executable_path/Frameworks."
            exit 1
          fi
          otool -L Payload/HLSDownloader.app/Frameworks/ffmpegkit.framework/ffmpegkit

          /usr/bin/ditto -c -k --keepParent \
            Payload artifacts/HLSDownloader-unsigned.ipa
          unzip -l artifacts/HLSDownloader-unsigned.ipa
          if unzip -Z1 artifacts/HLSDownloader-unsigned.ipa | grep -q '^__MACOSX/'; then
            echo "Unexpected macOS metadata was packaged in the IPA."
            exit 1
          fi
          shasum -a 256 artifacts/HLSDownloader-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: HLSDownloader-unsigned-iphoneos
          path: artifacts/HLSDownloader-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
