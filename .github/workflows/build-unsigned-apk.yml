name: Build unsigned Android APK

on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - "android/**"
      - ".github/workflows/build-unsigned-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/build-unsigned-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify unsigned APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        run: >-
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APK without signing
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:downloadFfmpegKit :app:assembleRelease

      - name: Validate unsigned APK and native payload
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          test "$(sha256sum android/app/libs/ffmpegkit.aar | cut -d ' ' -f1)" = \
            "4edd40f4d6e5504c9bc8f523af01392ac2921e9901e621afaead6f694e2b286b"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libffmpegkit.so"
          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libffmpegkit.so"
          unzip -l "$APK" | grep -F "lib/x86_64/libffmpegkit.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libhlsffmpeg.so"
          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libhlsffmpeg.so"
          unzip -l "$APK" | grep -F "lib/x86_64/libhlsffmpeg.so"
          unzip -l "$APK" | grep -F "assets/licenses/ThirdPartyNotices.txt"
          unzip -p "$APK" assets/licenses/ThirdPartyNotices.txt | grep -F "OPENSSL 3.6.0"
          unzip -p "$APK" assets/licenses/ThirdPartyNotices.txt | grep -F "GNU LESSER GENERAL PUBLIC LICENSE"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            echo "Expected an unsigned APK, but apksigner verification succeeded."
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" artifacts/HLSDownloader-unsigned.apk
          (cd artifacts && sha256sum HLSDownloader-unsigned.apk > HLSDownloader-unsigned.apk.sha256)
          cat artifacts/HLSDownloader-unsigned.apk.sha256

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v6
        with:
          name: HLSDownloader-unsigned-android
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
