name: Test Android app

on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - "android/**"
      - ".github/workflows/android-test.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-test.yml"

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run JVM tests and Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        run: >-
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:downloadFfmpegKit :app:testDebugUnitTest :app:lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: HLSDownloader-android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14
