name: Test Windows app

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: windows

jobs:
  test:
    name: Run Windows unit and integration tests
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.301

      - name: Install pinned FFmpeg for integration tests
        shell: powershell
        run: choco install ffmpeg --yes --no-progress --version=8.1.2

      - name: Verify pinned SDK
        shell: powershell
        run: |
          if ((dotnet --version).Trim() -ne '8.0.301') {
            throw "Expected .NET SDK 8.0.301, got $(dotnet --version)."
          }

      - name: Verify fail-closed Widevine EME guard
        run: node src/HLSDownloader.WebProbe/harness/verify-eme-guard.mjs

      - name: Restore test projects
        shell: powershell
        run: |
          dotnet restore tests/HLSDownloader.Core.Tests/HLSDownloader.Core.Tests.csproj
          dotnet restore tests/HLSDownloader.Media.Tests/HLSDownloader.Media.Tests.csproj

      - name: Run Core tests
        shell: powershell
        run: dotnet test tests/HLSDownloader.Core.Tests/HLSDownloader.Core.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=core.trx"

      - name: Run Media and Worker tests
        shell: powershell
        run: dotnet test tests/HLSDownloader.Media.Tests/HLSDownloader.Media.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=media.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
